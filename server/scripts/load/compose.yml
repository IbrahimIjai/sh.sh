services:
  db:
    image: postgres:17-alpine
    cpus: 2
    mem_limit: 1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-benchmark-only
      POSTGRES_DB: benchmark
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d benchmark"]
      interval: 1s
      timeout: 3s
      retries: 30
  api:
    build:
      context: ../..
    cpus: 2
    mem_limit: 512m
    environment:
      APP_ENV: development
      PORT: "8080"
      BASE_URL: http://api:8080
      DATABASE_URL: postgres://postgres:local-benchmark-only@db:5432/benchmark?sslmode=disable
      LIMEN_SECRET: "0123456789abcdef0123456789abcdef"
      EMAIL_PROVIDER: resend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
    depends_on:
      db:
        condition: service_healthy
