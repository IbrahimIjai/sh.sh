version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/migrations/*.sql"
    queries:
      - "db/queries/*.sql"
    gen:
      go:
        package: "db"
        out: "internal/db/generated"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
